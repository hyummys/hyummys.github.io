# GitHub Pages (Jekyll) 설정
#
# exclude: 아래 파일/폴더는 웹 배포(빌드 결과)에서 제외됩니다.
# git 저장소에는 그대로 남아 버전 관리되지만, https://hyummys.github.io 에는 올라가지 않습니다.
# (주의: 이미 푸시되어 공개된 적이 있다면, push 후 캐시/검색엔진/git 히스토리에는 흔적이 남을 수 있습니다.)
#
# 공개 진입점: index.html (단독)

exclude:
  # ── 제출 전용 자료 (개인정보·상세 이력 포함, 웹 비공개) ──
  - cv/                    # 이력서/포트폴리오 마크다운·PDF·HTML (국내 제출용)
  - cv_en/                 # 영문 이력서·커버레터 (해외 지원용)
  - STAR_template.md       # 인터뷰 원본 답변
  - resume.html            # 구 이력서 페이지 (로컬 보존)
  - portfolio.html         # 구 포트폴리오 페이지 (로컬 보존)

  # ── 개인정보·작성 메모 ──
  - CLAUDE.md              # 단일 진실 소스 + 작성 가이드라인
  - README.md              # 레포 설명

  # ── 빌드 산출물 / 의존성 (웹에 불필요) ──
  - node_modules/
  - generate-pdf.js
  - PDF-CONVERSION-GUIDE.md
  - PDF_GENERATION.md
  - package.json
  - package-lock.json
