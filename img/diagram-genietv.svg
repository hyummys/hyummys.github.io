<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a8ad"/>
    </marker>
  </defs>

  <!-- Olleh TV -->
  <rect x="20" y="34" width="180" height="64" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="110" y="61" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D1D1F">Olleh TV</text>
  <text x="110" y="82" text-anchor="middle" font-size="12.5" fill="#86868B">Web 뷰 기반 셋톱박스</text>

  <!-- arrow: AOSP 포팅 -->
  <line x1="204" y1="66" x2="372" y2="66" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="288" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#007AFF">AOSP 포팅 · 전면 전환</text>
  <text x="288" y="86" text-anchor="middle" font-size="11.5" fill="#86868B">메인 화면 + 키즈 콘텐츠 담당</text>

  <!-- Genie TV -->
  <rect x="376" y="34" width="184" height="64" rx="8" fill="#E8F1FF" stroke="#007AFF"/>
  <text x="468" y="61" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D1D1F">Genie TV</text>
  <text x="468" y="82" text-anchor="middle" font-size="12.5" fill="#86868B">Android TV · Leanback</text>

  <!-- 하단 chips -->
  <rect x="106" y="116" width="170" height="30" rx="7" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="191" y="136" text-anchor="middle" font-size="12.5" fill="#1D1D1F">기가지니2/3 전체 마이그레이션</text>

  <rect x="298" y="116" width="176" height="30" rx="7" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="386" y="136" text-anchor="middle" font-size="12.5" fill="#1D1D1F">4GB 메모리 무버벅임 KPI 만족</text>
</svg>
