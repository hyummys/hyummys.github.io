<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a8ad"/>
    </marker>
  </defs>

  <!-- 동화 영상 -->
  <rect x="6" y="50" width="106" height="60" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="59" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1D1D1F">동화 영상</text>
  <text x="59" y="96" text-anchor="middle" font-size="12.5" fill="#86868B">업로드 시 자동 트리거</text>

  <!-- arrow 1 -->
  <line x1="114" y1="80" x2="136" y2="80" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FFmpeg -->
  <rect x="140" y="50" width="120" height="60" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="200" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1D1D1F">FFmpeg · OpenCV</text>
  <text x="200" y="96" text-anchor="middle" font-size="12.5" fill="#86868B">프레임 추출</text>

  <!-- arrow 2 -->
  <line x1="262" y1="80" x2="284" y2="80" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 클러스터링 -->
  <rect x="288" y="50" width="140" height="60" rx="8" fill="#E8F1FF" stroke="#007AFF"/>
  <text x="358" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1D1D1F">페이지 경계 검출</text>
  <text x="358" y="96" text-anchor="middle" font-size="12.5" fill="#86868B">K-means + DBSCAN</text>

  <!-- arrow 3 -->
  <line x1="430" y1="80" x2="452" y2="80" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 결과 -->
  <rect x="456" y="50" width="118" height="60" rx="8" fill="#E9F8EE" stroke="#34C759"/>
  <text x="515" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#248A3D">페이지 자동 분할</text>
  <text x="515" y="96" text-anchor="middle" font-size="12.5" fill="#248A3D">50편+ · 편당 ~3분</text>
</svg>
