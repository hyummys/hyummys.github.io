<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a8ad"/>
    </marker>
  </defs>

  <!-- 1. 카드 에뮬레이터 -->
  <rect x="6" y="50" width="122" height="60" rx="8" fill="#E8F1FF" stroke="#007AFF"/>
  <text x="67" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1D1D1F">카드 에뮬레이터</text>
  <text x="67" y="96" text-anchor="middle" font-size="12.5" fill="#86868B">PyQt5 자체 개발</text>

  <!-- arrow 1 -->
  <line x1="130" y1="80" x2="152" y2="80" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="142" y="44" text-anchor="middle" font-size="11.5" fill="#86868B">ISO 14443</text>
  <text x="142" y="58" text-anchor="middle" font-size="11.5" fill="#86868B">RF</text>

  <!-- 2. 단말기 RF 리더 -->
  <rect x="156" y="50" width="122" height="60" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="217" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1D1D1F">단말기 RF 리더</text>
  <text x="217" y="96" text-anchor="middle" font-size="12.5" fill="#86868B">EMV L2 커널</text>

  <!-- arrow 2 -->
  <line x1="280" y1="80" x2="302" y2="80" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. 사전 검증 -->
  <rect x="306" y="50" width="122" height="60" rx="8" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="367" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#1D1D1F">사전 검증</text>
  <text x="367" y="96" text-anchor="middle" font-size="12.5" fill="#86868B">브랜드별 400+ 케이스</text>

  <!-- arrow 3 -->
  <line x1="430" y1="80" x2="452" y2="80" stroke="#a8a8ad" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. 인증 -->
  <rect x="456" y="50" width="118" height="60" rx="8" fill="#E9F8EE" stroke="#34C759"/>
  <text x="515" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#248A3D">LV2 인증 획득</text>
  <text x="515" y="96" text-anchor="middle" font-size="12.5" fill="#248A3D">Mastercard · VISA</text>
</svg>
